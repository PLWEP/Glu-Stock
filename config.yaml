# Glu-Stock Institutional Configuration

# --- SYSTEM SETTINGS ---
debug_mode: true
paper_trading: true
initial_cash: 100000000.0  # Rp 100 Juta
max_stocks_to_scan: 10

# --- BOT SETTINGS ---
telegram:
  enabled: true
whatsapp:
  enabled: true

# --- STRATEGY & RISK PARAMETERS ---
strategies:
  daily:
    tp1_pct: 0.01
    tp2_pct: 0.02
    sl_pct: 0.015
    duration: "1 Day"
    allocation_pct: 0.40
  weekly:
    tp1_pct: 0.03
    tp2_pct: 0.05
    sl_pct: 0.03
    duration: "1 Week"
    allocation_pct: 0.30
  monthly:
    tp1_pct: 0.10
    tp2_pct: 0.20
    sl_pct: 0.07
    duration: "1-3 Months"
    allocation_pct: 0.30

# --- PERFORMANCE LIMITS ---
risk:
  max_drawdown_limit: 0.15
  profit_freeze: true  # Prevents reinvesting profits above initial capital
